name: Public Release Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run public release check
        run: bash scripts/check_public_release.sh

      - name: Extra syntax checks
        run: |
          node --check scripts/profile_page_family.js
          node --check scripts/extract_iocs.js
          node --check scripts/run_ast_pipeline.js
          node --check scripts/scaffold_verbatim_harness.js 2>/dev/null || true

      - name: Harness generator regression tests
        run: |
          node --check scripts/test_scaffold_verbatim_harness.js 2>/dev/null || true
          node scripts/test_scaffold_verbatim_harness.js 2>/dev/null || echo "generator tests skipped (not in this bundle)"

      - name: Run public benchmarks
        run: node scripts/run_public_benchmarks.js

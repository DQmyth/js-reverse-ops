name: Public Release Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the rest of the repo is checked on. 24 is a line webcrack's native
        # part is built for (its engines field: Node 22 or 24), so the webcrack-backed
        # string-table cases are real there. On 20 npm silently skips the optional
        # dependency and those cases are skipped with that reason; everything else runs.
        node-version: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Run public release check
        run: bash scripts/check_public_release.sh

      - name: Extra syntax checks
        run: |
          node --check scripts/profile_page_family.js
          node --check scripts/extract_iocs.js
          node --check scripts/run_ast_pipeline.js
          node --check scripts/scaffold_verbatim_harness.js 2>/dev/null || true

      - name: Harness generator regression tests
        run: |
          node --check scripts/test_scaffold_verbatim_harness.js 2>/dev/null || true
          node scripts/test_scaffold_verbatim_harness.js 2>/dev/null || echo "generator tests skipped (not in this bundle)"

      - name: Run public benchmarks
        run: node scripts/run_public_benchmarks.js

      - name: Trigger-description eval smoke
        run: node scripts/run_trigger_evals.js

      - name: Unit / property / integration tests
        run: node --test tests/unit/*.test.js tests/property/*.test.js

      - name: Capability gym (M1-M8 end-to-end)
        run: |
          node scripts/gym_generate_targets.js --out gym-targets >/dev/null
          node scripts/gym_run.js --targets gym-targets
